</button>

</div>
<div class="flex flex-col flex-grow justify-between">
<div>

</div>
<div class="flex items-center justify-between mt-sm">
<span class="font-headline-md text-headline-md text-primary">$24.99</span>
<div class="flex items-center bg-surface-variant rounded-full p-1 border border-outline-variant">

<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-label-md text-label-md w-8 text-center">1</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
<button class="absolute top-md right-md text-text-secondary hover:text-error transition-colors p-1">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>

<div class="flex items-center justify-between mt-sm">

</div>
</div>
<button class="absolute top-md right-md text-text-secondary hover:text-error transition-colors p-1">

<span class="text-on-background">$89.99</span>
</div>
<div class="flex justify-between font-body-md text-body-md text-text-secondary">

<span class="text-on-background">$4.99</span>
</div>

</button>

<span class="material-symbols-outlined mb-1 text-[24px]" data-icon="person">person</span>
